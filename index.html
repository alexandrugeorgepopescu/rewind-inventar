<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rewind Inventar</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js');
        });
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'cloud-dancer': '#F0EEE9',
              'black-night': '#212529',
              'yellow-coffee': '#FBE485',
              'alb-cald': '#FFFBF3',
              'gray-text': '#6c757d',
              'error': '#dc3545',
              'success': '#198754'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            body { @apply bg-cloud-dancer text-black-night pb-[80px] font-sans m-0 p-0; -webkit-tap-highlight-color: transparent; }
            * { @apply box-border; }
            
            header { @apply bg-black-night text-cloud-dancer text-center p-6 sticky top-0 z-50 shadow-lg; }
            /* Mărim sigla semnificativ de la 40px la 80px și dăm spațiu */
            header img { @apply h-20 mx-auto mb-3 transition-transform hover:scale-105 duration-300; }
            .tagline { @apply text-xs tracking-widest font-bold text-yellow-coffee; }
            .header-content { @apply flex flex-col items-center; }

            .container { @apply p-4 max-w-3xl mx-auto; }
            .screen { @apply hidden; }
            .screen.active { @apply block animate-[fadeIn_0.3s_ease-out]; }

            input[type="text"], input[type="password"], select { @apply w-full p-3 my-2 border border-gray-300 rounded-xl bg-alb-cald text-base font-sans transition-all duration-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-yellow-coffee focus:border-transparent; }
            
            button { @apply w-full p-4 bg-yellow-coffee text-black-night rounded-xl text-base font-black cursor-pointer mt-2 transition-all duration-200 border-none shadow-md hover:shadow-lg hover:-translate-y-0.5 active:translate-y-0 active:scale-95; }
            button.btn-secondary { @apply bg-black-night text-yellow-coffee; }
            button.btn-whatsapp { @apply bg-[#25D366] text-white mb-2; }
            
            .bottom-nav { @apply fixed bottom-0 left-0 w-full bg-alb-cald flex justify-around shadow-[0_-4px_20px_rgba(0,0,0,0.08)] z-[100] rounded-t-3xl; }
            .nav-item { @apply flex-1 text-center py-4 text-gray-text font-bold text-[13px] cursor-pointer transition-colors duration-200 flex flex-col items-center justify-center gap-1; }
            .nav-item.active { @apply text-black-night border-t-4 border-yellow-coffee rounded-t-sm; }

            .sticky-top-controls { @apply sticky top-[110px] bg-cloud-dancer/95 py-3 z-40 border-b border-gray-200 backdrop-blur-md mb-2; }
            .progress-bar-container { @apply bg-gray-300 h-2 rounded-full mt-3 overflow-hidden shadow-inner; }
            .progress-bar { @apply bg-yellow-coffee h-full w-0 transition-all duration-500 ease-out; }
            .progress-text { @apply text-xs font-bold text-right mt-1 text-gray-600; }
            
            .accordion { @apply mt-4; }
            .accordion-header { @apply bg-alb-cald p-4 rounded-xl font-black mb-2 flex justify-between shadow-sm cursor-pointer transition-all hover:shadow-md hover:-translate-y-0.5 border border-transparent hover:border-gray-100; }
            .accordion-content { @apply hidden px-1 pb-4; }
            .accordion-content.open { @apply block animate-[fadeIn_0.3s_ease-out]; }
            
            .product-row { @apply bg-alb-cald p-3 rounded-xl mb-3 grid grid-cols-[2fr_1fr_1fr] gap-3 items-center shadow-sm border border-gray-100 transition-all hover:shadow-md; }
            .product-name { @apply font-bold text-[14px] leading-tight; }
            .product-row input { @apply m-0 p-2.5 text-[15px] font-bold text-center; }

            .saving-indicator { @apply fixed bottom-[90px] right-4 bg-black-night text-yellow-coffee px-5 py-2.5 rounded-full text-xs font-bold opacity-0 transition-all duration-300 pointer-events-none shadow-xl transform translate-y-4; }
            .saving-indicator.show { @apply opacity-100 translate-y-0; }

            .chips { @apply flex gap-2 overflow-x-auto pb-3 mb-2 scrollbar-hide; }
            .chip { @apply px-5 py-2.5 bg-alb-cald rounded-full text-sm font-bold whitespace-nowrap cursor-pointer border border-gray-200 transition-all duration-200 hover:bg-gray-100 shadow-sm; }
            .chip.active { @apply bg-black-night text-yellow-coffee border-black-night shadow-md transform scale-105; }
            
            .report-section { @apply mb-6; }
            .report-title { @apply font-black mb-3 border-b-2 border-yellow-coffee pb-2 text-lg; }
            .report-item { @apply bg-alb-cald p-4 rounded-xl mb-3 shadow-sm border border-gray-100 transition-all hover:shadow-md; }
            .report-item-header { @apply font-bold flex justify-between mb-3 text-[15px]; }
            .report-loc { @apply text-[13px] flex justify-between text-gray-500 ml-3 border-l-2 border-gray-200 pl-3 py-0.5 my-1; }
            .report-loc.has-necesar { @apply text-black-night font-bold border-yellow-coffee; }

            #admin-auth { @apply text-center mt-12 bg-alb-cald p-8 rounded-2xl shadow-sm border border-gray-100; }
            .admin-product { @apply bg-alb-cald p-5 rounded-xl mb-4 relative shadow-sm border border-gray-100 transition-all; }
            .admin-product.inactive { @apply opacity-60 grayscale-[50%]; }
            .admin-grid { @apply grid grid-cols-2 gap-3 mt-2; }
            .checkbox-group { @apply flex gap-5 items-center text-sm my-4 flex-wrap bg-white/50 p-3 rounded-lg; }
            .checkbox-group input[type="checkbox"] { @apply w-5 h-5 cursor-pointer accent-yellow-coffee rounded; }

            .hidden { @apply !hidden; }
            .loader { @apply text-center p-8 font-bold animate-pulse text-gray-text; }

            /* Ascundere scrollbar pe elementele care fac scroll yatay */
            .scrollbar-hide::-webkit-scrollbar { display: none; }
            .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        }
    </style>

</head>
<body>

<header>
    <div class="header-content">
        <!-- Sigla Rewind din brand manual -->
        <img src="https://rewindcafe.ro/wp-content/themes/rewind-theme/images/sigla.png" alt="Rewind" onerror="this.style.display='none'; document.getElementById('alt-logo').style.display='block';">
        <h2 id="alt-logo" style="display:none; color: var(--yellow-coffee);">REWIND</h2>
        <div class="tagline">COFFEE • MUSIC • VIBE</div>
    </div>
</header>

<div class="container">
    
    <!-- ECRAN 1: INVENTAR -->
    <div id="screen-inventar" class="screen active">
        <div class="sticky-top-controls">
            <select id="select-locatie">
                <option value="" disabled selected>Alege locația...</option>
                <option value="Miroslava">Miroslava</option>
                <option value="Pacurari">Kaufland Păcurari</option>
                <option value="Alexandru">Kaufland Alexandru</option>
            </select>
            <input type="text" id="input-operator" placeholder="Numele tău (Operator)">
            <input type="text" id="search-inventar" placeholder="Caută produs (ex: Portocale)...">
            
            <div class="progress-text" id="progress-text">0/0 produse completate</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div id="inventar-loader" class="loader">Se încarcă produsele...</div>
        <div id="inventar-container"></div>
        
        <br>
        <button id="btn-finalizare" class="hidden">Finalizează Inventarul</button>
    </div>

    
    <!-- ECRAN 2: CENTRALIZATOR -->
    <div id="screen-centralizator" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <button id="btn-genereaza-raport" style="margin:0;">Generează Live</button>
            <button id="btn-istoric-sesiuni" class="btn-secondary" style="margin:0;">Istoric Salvate</button>
        </div>
        <div id="centralizator-loader" class="loader hidden">Se procesează datele...</div>
        
        <div id="raport-content" class="hidden" style="margin-top: 15px;">
            <div class="chips" id="raport-chips"></div>
            <div id="export-buttons" class="hidden" style="margin-bottom:15px; display:flex; flex-direction:column; gap:5px;"></div>
            <button id="btn-salveaza-sesiune" style="margin-bottom:15px; background:var(--success); color:white;">💾 Salvează Sesiunea</button>
            <div id="raport-list"></div>
        </div>

        <div id="istoric-sesiuni" class="hidden" style="margin-top: 15px;">
            <h3 style="margin-bottom:10px;">Sesiuni Salvate</h3>
            <div id="lista-sesiuni"></div>
        </div>

        <div id="sesiune-view" class="hidden" style="margin-top: 15px;">
            <button class="btn-secondary" onclick="showIstoricSesiuni()" style="margin-bottom:15px;">&larr; Înapoi la Istoric</button>
            <div id="sesiune-header" style="margin-bottom:15px; font-weight:bold;"></div>
            <div class="chips" id="sesiune-chips"></div>
            <div id="sesiune-export-buttons" class="hidden" style="margin-bottom: 15px; display:flex; flex-direction:column; gap:5px;"></div>
            <button id="btn-export-csv" class="btn-secondary" style="margin-bottom:15px;">📄 Descarcă CSV</button>
            <div id="sesiune-linii"></div>
            <button id="btn-finalizare-sesiune" style="margin-top:20px; background:var(--success); color:white;">✔️ Finalizează Sesiunea</button>
        </div>
    </div>

    <!-- ECRAN 3: ADMIN -->
    <div id="screen-admin" class="screen">
        <div id="admin-auth">
            <h3>Acces Management</h3>
            <input type="password" id="admin-pin" placeholder="Introdu PIN-ul">
            <button onclick="checkAdminPin()">Log in</button>
        </div>
        <div id="admin-dashboard" class="hidden">
            <button class="btn-secondary" onclick="openAddProduct()">+ Adaugă Produs Nou</button>
            
            <div id="admin-add-form" class="hidden admin-product" style="border: 2px solid var(--yellow-coffee);">
                <h4>Adaugă Produs</h4>
                <input type="text" id="new-nume" placeholder="Nume Produs">
                <input type="text" id="new-categorie" placeholder="Categorie">
                <div class="admin-grid">
                    <select id="new-canal">
                        <option value="Metro">Metro</option>
                        <option value="Online">Online</option>
                        <option value="Dropshot">Dropshot</option>
                        <option value="Interuno">Interuno</option>
                    </select>
                    <input type="text" id="new-unitate" placeholder="Unitate (buc/kg/etc)" value="buc">
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" class="new-loc" value="Miroslava" checked> Miroslava</label>
                    <label><input type="checkbox" class="new-loc" value="Pacurari" checked> Păcurari</label>
                    <label><input type="checkbox" class="new-loc" value="Alexandru" checked> Alexandru</label>
                </div>
                <button onclick="saveNewProduct()">Salvează Produs</button>
                <button class="btn-secondary" onclick="document.getElementById('admin-add-form').classList.add('hidden')">Anulează</button>
            </div>

            
            <div id="admin-channels" class="admin-product" style="margin-top:20px; border: 2px solid var(--black-night);">
                <h4>Administrare Canale</h4>
                <div style="display:flex; gap:10px; margin-bottom:10px; margin-top:10px;">
                    <input type="text" id="new-canal-name" placeholder="Nume canal nou" style="margin:0;">
                    <button onclick="saveNewCanal()" style="margin:0; width:auto; white-space:nowrap;">Adaugă</button>
                </div>
                <div id="canale-list"></div>
            </div>

            <div style="margin-top: 20px;">
                <input type="text" id="search-admin" placeholder="Caută produs pentru editare...">
                <div id="admin-product-list"></div>
            </div>
        </div>
    </div>

</div>

<!-- Bottom Navigation -->
<div class="bottom-nav">
    <div class="nav-item active" onclick="switchScreen('inventar', this)">📋<br>Stoc</div>
    <div class="nav-item" onclick="switchScreen('centralizator', this)">📊<br>Centralizator</div>
    <div class="nav-item" onclick="switchScreen('admin', this)">⚙️<br>Admin</div>
</div>

<div id="saving-indicator" class="saving-indicator">Se salvează...</div>

<script>
    // Configurare Supabase v2
    const supabaseUrl = 'https://btucmapzyzpnzdswisvq.supabase.co';
    const supabaseKey = 'sb_publishable_qQoPWXFXHlFTqMNnEIJu0A_AvxwtwEZ';
    const supabaseClient = customElements.get('supabase') ? null : window.supabase.createClient(supabaseUrl, supabaseKey);

    // Variabile Globale
    let catalogProduse = [];
    let canaleList = [];
    let currentSesiune = null;
    let currentSesiuneLinii = [];
    let stateInventar = {}; // { produs_id: { stoc, necesar } }
    let saveTimeout = null;
    let currentLocation = localStorage.getItem('rewind_location') || '';
    let operatorName = localStorage.getItem('rewind_operator') || '';
    const ADMIN_PIN = '2024'; // PIN simplu conform cerintei §5 protecție simplă

    // Inițializare
    document.addEventListener('DOMContentLoaded', async () => {
        if (currentLocation) {
            document.getElementById('select-locatie').value = currentLocation;
        }
        if (operatorName) {
            document.getElementById('input-operator').value = operatorName;
        }

        document.getElementById('select-locatie').addEventListener('change', async (e) => {
            currentLocation = e.target.value;
            localStorage.setItem('rewind_location', currentLocation);
            await loadInventarData();
        });

        document.getElementById('input-operator').addEventListener('change', (e) => {
            operatorName = e.target.value;
            localStorage.setItem('rewind_operator', operatorName);
        });

        document.getElementById('search-inventar').addEventListener('input', renderInventarUI);
        
        // Incarcam catalogul complet o singura data la startup
        
        await fetchCanale();
        await fetchCatalog();

        if (currentLocation) {
            await loadInventarData();
        } else {
            document.getElementById('inventar-loader').style.display = 'none';
        }

        // Setup Centralizator Chips
        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                renderRaportUI(e.target.dataset.canal);
            });
        });
    });

    function switchScreen(screenId, navEl) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('screen-' + screenId).classList.add('active');
        
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        navEl.classList.add('active');

        if (screenId === 'admin' && document.getElementById('admin-dashboard').classList.contains('hidden')) {
            // reset pin state
            document.getElementById('admin-pin').value = '';
        }
        window.scrollTo(0, 0);
    }

    // ==========================================
    // ECRAN 1: INVENTAR
    // ==========================================

    async function fetchCatalog() {
        const { data, error } = await supabaseClient
            .from('produse')
            .select('*')
            .eq('activ', true)
            .order('ordine', { ascending: true })
            .order('nume', { ascending: true });
        
        if (error) {
            console.error("Error fetching catalog", error);
            alert("Eroare la descărcarea produselor. Verifică conexiunea.");
        } else {
            catalogProduse = data;
        }
    }

    
    async function fetchCanale() {
        const { data, error } = await supabaseClient.from('canale').select('*').order('ordine', { ascending: true });
        if (!error && data) {
            canaleList = data;
            renderCanaleUI();
        }
    }

    function renderCanaleUI() {
        const activeCanale = canaleList.filter(c => c.activ);
        
        // Admin Select
        const newCanalSelect = document.getElementById('new-canal');
        if (newCanalSelect) {
            newCanalSelect.innerHTML = activeCanale.map(c => `<option value="${c.nume}">${c.nume}</option>`).join('');
        }

        // Admin List
        const adminCanaleList = document.getElementById('canale-list');
        if (adminCanaleList) {
            adminCanaleList.innerHTML = canaleList.map(c => `
                <div style="display:flex; justify-content:space-between; align-items:center; padding:5px 0; border-bottom:1px solid #eee;">
                    <span style="${!c.activ ? 'text-decoration:line-through; color:#999;' : ''}">${c.nume}</span>
                    <button class="btn-secondary" style="width:auto; padding:3px 8px; margin:0; font-size:12px;" onclick="toggleCanalStatus('${c.id}', ${!c.activ})">
                        ${c.activ ? 'Dezactivează' : 'Activează'}
                    </button>
                </div>
            `).join('');
        }
    }

    async function toggleCanalStatus(id, activ) {
        await supabaseClient.from('canale').update({ activ }).eq('id', id);
        await fetchCanale();
        if(!document.getElementById('raport-content').classList.contains('hidden')) renderCentralizatorChips();
    }

    async function saveNewCanal() {
        const nume = document.getElementById('new-canal-name').value.trim();
        if (!nume) return;
        const { error } = await supabaseClient.from('canale').insert([{ nume, ordine: 99 }]);
        if (error) alert("Eroare: " + error.message);
        else {
            document.getElementById('new-canal-name').value = '';
            await fetchCanale();
        }
    }

    function renderCentralizatorChips(containerId = 'raport-chips', isSesiune = false) {
        const activeCanale = canaleList.filter(c => c.activ);
        const chipsContainer = document.getElementById(containerId);
        if(!chipsContainer) return;

        let chipsHTML = `<div class="chip active" data-canal="Toate">Toate</div>`;
        activeCanale.forEach(c => {
            chipsHTML += `<div class="chip" data-canal="${c.nume}">${c.nume}</div>`;
        });
        chipsContainer.innerHTML = chipsHTML;
        
        chipsContainer.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                chipsContainer.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                if (isSesiune) {
                    renderSesiuneLinii(e.target.dataset.canal);
                } else {
                    renderRaportUI(e.target.dataset.canal);
                }
            });
        });

        // Export Buttons
        const expCont = document.getElementById(isSesiune ? 'sesiune-export-buttons' : 'export-buttons');
        let exportHTML = '';
        activeCanale.forEach(c => {
            exportHTML += `<button class="btn-whatsapp" style="margin-bottom:0;" onclick="${isSesiune ? 'exportWhatsAppSesiune' : 'exportWhatsApp'}('${c.nume}')">🛒 Trimite ${c.nume.toUpperCase()}</button>`;
        });
        expCont.innerHTML = exportHTML;
        expCont.classList.remove('hidden');
    }

    async function loadInventarData() {
        if (!currentLocation) return;
        document.getElementById('inventar-loader').style.display = 'block';
        document.getElementById('inventar-container').innerHTML = '';
        document.getElementById('btn-finalizare').classList.add('hidden');

        const { data, error } = await supabaseClient
            .from('inventar')
            .select('produs_id, stoc, necesar')
            .eq('locatie', currentLocation);

        if (error) {
            console.error("Error fetching inventar", error);
            alert("Eroare la citirea inventarului.");
        } else {
            stateInventar = {};
            data.forEach(item => {
                stateInventar[item.produs_id] = { stoc: item.stoc || '', necesar: item.necesar || '' };
            });
            renderInventarUI();
        }
        document.getElementById('inventar-loader').style.display = 'none';
    }

    function renderInventarUI() {
        if (!currentLocation) return;
        const container = document.getElementById('inventar-container');
        const searchTerm = document.getElementById('search-inventar').value.toLowerCase();
        
        // Filtram produsele pentru locatia curenta si cautare
        const produseFiltrate = catalogProduse.filter(p => {
            const hasLocation = p.locatii.includes(currentLocation) || p.locatii.includes(currentLocation.replace('Kaufland ', ''));
            const matchesSearch = p.nume.toLowerCase().includes(searchTerm);
            return hasLocation && matchesSearch;
        });

        // Grupăm pe categorii
        const categorii = {};
        produseFiltrate.forEach(p => {
            if (!categorii[p.categorie]) categorii[p.categorie] = [];
            categorii[p.categorie].push(p);
        });

        container.innerHTML = '';
        
        // Pentru calcul progres
        let totalItems = produseFiltrate.length;
        let completedItems = 0;

        for (const [catName, produseCat] of Object.entries(categorii)) {
            const accWrapper = document.createElement('div');
            accWrapper.className = 'accordion';

            const header = document.createElement('div');
            header.className = 'accordion-header';
            header.innerHTML = `<span>${catName} (${produseCat.length})</span> <span>▼</span>`;
            
            const content = document.createElement('div');
            content.className = 'accordion-content';
            // Deschide acordeonul automat dacă se face o căutare specifică
            if (searchTerm.length > 1) content.classList.add('open');

            header.onclick = () => {
                content.classList.toggle('open');
                header.querySelector('span:last-child').textContent = content.classList.contains('open') ? '▲' : '▼';
            };

            produseCat.forEach(p => {
                const valStoc = stateInventar[p.id]?.stoc || '';
                const valNecesar = stateInventar[p.id]?.necesar || '';
                if (valStoc.trim() !== '') completedItems++;

                const row = document.createElement('div');
                row.className = 'product-row';
                row.innerHTML = `
                    <div class="product-name">${p.nume} <br><small style="color:#666">${p.unitate}</small></div>
                    <input type="text" placeholder="Stoc real" value="${valStoc}" oninput="queueSave('${p.id}', 'stoc', this.value)">
                    <input type="text" placeholder="Necesar" value="${valNecesar}" oninput="queueSave('${p.id}', 'necesar', this.value)">
                `;
                content.appendChild(row);
            });

            accWrapper.appendChild(header);
            accWrapper.appendChild(content);
            container.appendChild(accWrapper);
        }

        // Actualizare progres
        const progressPercent = totalItems === 0 ? 0 : (completedItems / totalItems) * 100;
        document.getElementById('progress-bar').style.width = `${progressPercent}%`;
        document.getElementById('progress-text').textContent = `${completedItems}/${totalItems} produse completate`;

        if (totalItems > 0 && document.getElementById('search-inventar').value === '') {
            document.getElementById('btn-finalizare').classList.remove('hidden');
        } else {
            document.getElementById('btn-finalizare').classList.add('hidden');
        }
    }

    function queueSave(produsId, field, value) {
        if (!stateInventar[produsId]) stateInventar[produsId] = { stoc: '', necesar: '' };
        stateInventar[produsId][field] = value;
        
        // Debounce salvare in Supabase
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            saveToSupabase(produsId);
            updateProgress(); // update local UI quickly
        }, 800);
    }

    async function saveToSupabase(produsId) {
        if (!currentLocation || !operatorName) {
            if (!operatorName) {
                alert("Te rugăm să completezi Numele Operatorului sus!");
                document.getElementById('input-operator').focus();
            }
            return;
        }

        const indicator = document.getElementById('saving-indicator');
        indicator.classList.add('show');
        
        const data = stateInventar[produsId];
        
        const { error } = await supabaseClient.from('inventar').upsert({
            produs_id: produsId,
            locatie: currentLocation,
            stoc: data.stoc,
            necesar: data.necesar,
            actualizat_de: operatorName
        }, { onConflict: 'produs_id, locatie' });

        if (error) console.error("Save error", error);
        
        setTimeout(() => indicator.classList.remove('show'), 1000);
    }

    function updateProgress() {
        const searchTerm = document.getElementById('search-inventar').value.toLowerCase();
        if(searchTerm.length > 0) return; // nu updatam cand e filtrat
        let total = 0, completed = 0;
        catalogProduse.forEach(p => {
            if (p.locatii.includes(currentLocation)) {
                total++;
                if (stateInventar[p.id] && stateInventar[p.id].stoc.trim() !== '') completed++;
            }
        });
        document.getElementById('progress-bar').style.width = `${total===0?0:(completed/total)*100}%`;
        document.getElementById('progress-text').textContent = `${completed}/${total} produse completate`;
    }

    document.getElementById('btn-finalizare').addEventListener('click', () => {
        alert("Inventarul a fost salvat și sincronizat cu succes! Mulțumim, " + (operatorName || "operator") + "!");
        window.scrollTo(0,0);
    });


    // ==========================================
    // ECRAN 2: CENTRALIZATOR
    // ==========================================
    
    let raportDateAgregate = [];

    document.getElementById('btn-genereaza-raport').addEventListener('click', async () => {
        document.getElementById('centralizator-loader').classList.remove('hidden');
        document.getElementById('raport-content').classList.add('hidden');
        
        // Fetch all inventar
        const { data: invData, error: invError } = await supabaseClient.from('inventar').select('produs_id, locatie, stoc, necesar, actualizat_la');
        
        if (invError) {
            alert("Eroare generare raport");
            return;
        }

        // Aggregate by product
        const aggregate = {};
        
        // Ensure catalog is loaded
        if (catalogProduse.length === 0) await fetchCatalog();

        invData.forEach(row => {
            if (!row.necesar && !row.stoc) return; // skip complet goale
            
            if (!aggregate[row.produs_id]) {
                const prodInfo = catalogProduse.find(p => p.id === row.produs_id);
                if (!prodInfo) return; // skipped inactive or deleted
                aggregate[row.produs_id] = {
                    id: row.produs_id,
                    nume: prodInfo.nume,
                    categorie: prodInfo.categorie,
                    canal: prodInfo.canal,
                    ordine: prodInfo.ordine,
                    unitate: prodInfo.unitate,
                    locatii: {}
                };
            }
            aggregate[row.produs_id].locatii[row.locatie] = {
                stoc: row.stoc || '—',
                necesar: row.necesar || '—'
            };
        });

        raportDateAgregate = Object.values(aggregate).filter(p => {
            // Regula 1: produsul intra DOAR daca cel putin o locatie are necesar completat
            return Object.values(p.locatii).some(l => l.necesar !== '—' && l.necesar !== '0' && l.necesar.trim() !== '');
        });

        // Regula 4: Sortare canal -> categorie -> ordine -> nume
        raportDateAgregate.sort((a, b) => {
            if (a.canal !== b.canal) return a.canal.localeCompare(b.canal);
            if (a.categorie !== b.categorie) return a.categorie.localeCompare(b.categorie);
            if (a.ordine !== b.ordine) return a.ordine - b.ordine;
            return a.nume.localeCompare(b.nume);
        });

        document.getElementById('centralizator-loader').classList.add('hidden');
        document.getElementById('raport-content').classList.remove('hidden');
        
        // Select 'Toate' implicitly
        document.querySelector('.chip[data-canal="Toate"]').click();
    });

    function renderRaportUI(canalFilter) {
        const container = document.getElementById('raport-list');
        container.innerHTML = '';
        document.getElementById('export-buttons').classList.toggle('hidden', canalFilter !== 'Toate');

        const dateFiltrate = canalFilter === 'Toate' 
            ? raportDateAgregate 
            : raportDateAgregate.filter(p => p.canal === canalFilter);

        if (dateFiltrate.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Niciun necesar pentru acest canal.</p>';
            return;
        }

        let currentCat = '';

        dateFiltrate.forEach(p => {
            if (p.categorie !== currentCat && canalFilter === 'Toate') {
                currentCat = p.categorie;
                const catTitle = document.createElement('div');
                catTitle.className = 'report-title';
                catTitle.textContent = currentCat;
                container.appendChild(catTitle);
            }

            // Calculare TOTAL necesar
            let sum = 0;
            let hasNonNumeric = false;
            let rawVals = [];

            Object.values(p.locatii).forEach(l => {
                if (l.necesar !== '—') {
                    const n = parseFloat(l.necesar.replace(',', '.'));
                    if (!isNaN(n)) sum += n;
                    else hasNonNumeric = true;
                    rawVals.push(l.necesar);
                }
            });

            let totalDisplay = sum.toString();
            if (hasNonNumeric) {
                totalDisplay = `${sum > 0 ? sum + ' + ' : ''} "${rawVals.join(', ')}" (⚠ Verifică manual)`;
            }

            const item = document.createElement('div');
            item.className = 'report-item';
            
            let locHTML = '';
            for (const loc of ['Miroslava', 'Pacurari', 'Alexandru']) {
                const dataLoc = p.locatii[loc];
                if (dataLoc) {
                    const hasNecesar = dataLoc.necesar !== '—' && dataLoc.necesar !== '';
                    locHTML += `<div class="report-loc ${hasNecesar ? 'has-necesar' : ''}">
                        📍 ${loc}: Stoc ${dataLoc.stoc} &rarr; Necesar ${dataLoc.necesar}
                    </div>`;
                }
            }

            item.innerHTML = `
                <div class="report-item-header">
                    <span>📦 ${p.nume} <small>(${p.canal})</small></span>
                    <span style="color:var(--error);">TOTAL: ${totalDisplay} ${p.unitate}</span>
                </div>
                ${locHTML}
            `;
            container.appendChild(item);
        });
    }

    function exportWhatsApp(canal) {
        const dateCanal = raportDateAgregate.filter(p => p.canal === canal);
        if(dateCanal.length === 0) {
            alert(`Niciun necesar pentru ${canal}.`);
            return;
        }

        const dateString = new Date().toLocaleString('ro-RO');
        let text = `*COMANDĂ ${canal.toUpperCase()}* - ${dateString}\n\n`;

        dateCanal.forEach(p => {
            // calcul total
            let sum = 0;
            let rawVals = [];
            let hasNonNumeric = false;
            Object.values(p.locatii).forEach(l => {
                if (l.necesar !== '—') {
                    const n = parseFloat(l.necesar.replace(',', '.'));
                    if (!isNaN(n)) sum += n;
                    else hasNonNumeric = true;
                    rawVals.push(l.necesar);
                }
            });
            let total = hasNonNumeric ? rawVals.join(' + ') : sum;

            text += `📦 *${p.nume}* — ${total} ${p.unitate}\n`;
            
            // Daca e Metro sau Online, pastram distributia
            if (canal === 'Metro' || canal === 'Online') {
                for (const loc of ['Miroslava', 'Pacurari', 'Alexandru']) {
                    const dataLoc = p.locatii[loc];
                    if (dataLoc && dataLoc.necesar !== '—' && dataLoc.necesar !== '') {
                        text += `   📍 ${loc}: Stoc ${dataLoc.stoc} -> Necesar ${dataLoc.necesar}\n`;
                    }
                }
            }
        });

        const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    // ==========================================
    
    // ==========================================
    // SESIUNI APROVIZIONARE
    // ==========================================

    document.getElementById('btn-istoric-sesiuni').addEventListener('click', showIstoricSesiuni);
    
    // Înlocuim click-ul original pe btn-genereaza-raport
    document.getElementById('btn-genereaza-raport').replaceWith(document.getElementById('btn-genereaza-raport').cloneNode(true));
    
    document.getElementById('btn-genereaza-raport').addEventListener('click', async () => {
        document.getElementById('istoric-sesiuni').classList.add('hidden');
        document.getElementById('sesiune-view').classList.add('hidden');
        document.getElementById('raport-content').classList.add('hidden');
        document.getElementById('centralizator-loader').classList.remove('hidden');
        
        const { data: invData, error: invError } = await supabaseClient.from('inventar').select('produs_id, locatie, stoc, necesar, actualizat_la');
        
        if (invError) {
            alert("Eroare generare raport");
            return;
        }

        const aggregate = {};
        if (catalogProduse.length === 0) await fetchCatalog();

        invData.forEach(row => {
            if (!row.necesar && !row.stoc) return;
            
            if (!aggregate[row.produs_id]) {
                const prodInfo = catalogProduse.find(p => p.id === row.produs_id);
                if (!prodInfo) return; 
                aggregate[row.produs_id] = {
                    id: row.produs_id,
                    nume: prodInfo.nume,
                    categorie: prodInfo.categorie,
                    canal: prodInfo.canal,
                    ordine: prodInfo.ordine,
                    unitate: prodInfo.unitate,
                    locatii: {}
                };
            }
            aggregate[row.produs_id].locatii[row.locatie] = {
                stoc: row.stoc || '—',
                necesar: row.necesar || '—'
            };
        });

        raportDateAgregate = Object.values(aggregate).filter(p => {
            return Object.values(p.locatii).some(l => l.necesar !== '—' && l.necesar !== '0' && l.necesar.trim() !== '');
        });

        raportDateAgregate.sort((a, b) => {
            if (a.canal !== b.canal) return a.canal.localeCompare(b.canal);
            if (a.categorie !== b.categorie) return a.categorie.localeCompare(b.categorie);
            if (a.ordine !== b.ordine) return a.ordine - b.ordine;
            return a.nume.localeCompare(b.nume);
        });

        document.getElementById('centralizator-loader').classList.add('hidden');
        document.getElementById('raport-content').classList.remove('hidden');
        
        renderCentralizatorChips('raport-chips', false);
        const btnToate = document.querySelector('#raport-chips .chip[data-canal="Toate"]');
        if(btnToate) btnToate.click();
    });

    async function showIstoricSesiuni() {
        document.getElementById('raport-content').classList.add('hidden');
        document.getElementById('sesiune-view').classList.add('hidden');
        document.getElementById('istoric-sesiuni').classList.remove('hidden');
        
        const { data, error } = await supabaseClient.from('sesiuni_aprovizionare').select('*').order('creata_la', { ascending: false });
        if (error) { alert("Eroare citire sesiuni"); return; }
        
        const list = document.getElementById('lista-sesiuni');
        if (data.length === 0) {
            list.innerHTML = '<p style="text-align:center; padding: 20px;">Nu există sesiuni salvate.</p>';
            return;
        }
        
        list.innerHTML = data.map(s => `
            <div class="report-item" style="cursor:pointer;" onclick="openSesiune('${s.id}')">
                <div style="display:flex; justify-content:space-between;">
                    <strong>${new Date(s.creata_la).toLocaleString('ro-RO')}</strong>
                    <span style="color:${s.status==='deschisa'?'var(--success)':'var(--gray-text)'}">${s.status.toUpperCase()}</span>
                </div>
                <div style="font-size:13px; color:var(--gray-text);">Autor: ${s.creata_de} ${s.nota ? ' | Nota: '+s.nota : ''}</div>
            </div>
        `).join('');
    }

    async function openSesiune(id) {
        document.getElementById('istoric-sesiuni').classList.add('hidden');
        document.getElementById('sesiune-view').classList.remove('hidden');
        
        const { data: sesiune } = await supabaseClient.from('sesiuni_aprovizionare').select('*').eq('id', id).single();
        const { data: linii } = await supabaseClient.from('sesiuni_linii').select('*').eq('sesiune_id', id);
        
        currentSesiune = sesiune;
        currentSesiuneLinii = linii;
        
        document.getElementById('sesiune-header').innerHTML = `Sesiune: ${new Date(sesiune.creata_la).toLocaleString('ro-RO')} <br><small>Status: ${sesiune.status}</small>`;
        
        renderCentralizatorChips('sesiune-chips', true);
        const btnToate = document.querySelector('#sesiune-chips .chip[data-canal="Toate"]');
        if(btnToate) btnToate.click();
        
        if (sesiune.status === 'finalizata') {
            document.getElementById('btn-finalizare-sesiune').classList.add('hidden');
        } else {
            document.getElementById('btn-finalizare-sesiune').classList.remove('hidden');
        }

        document.getElementById('btn-export-csv').onclick = () => exportCSV();
    }

    function renderSesiuneLinii(canalFilter) {
        const container = document.getElementById('sesiune-linii');
        const isFinal = currentSesiune.status === 'finalizata';
        document.getElementById('sesiune-export-buttons').classList.toggle('hidden', canalFilter === 'Toate');

        const filtrate = canalFilter === 'Toate' ? currentSesiuneLinii : currentSesiuneLinii.filter(l => l.canal === canalFilter);
        
        if (filtrate.length === 0) {
            container.innerHTML = '<p style="text-align:center; padding: 20px;">Niciun produs pentru acest canal.</p>';
            return;
        }

        container.innerHTML = filtrate.map(l => {
            let locHTML = '';
            for (const [loc, data] of Object.entries(l.distributie)) {
                if (data.necesar && data.necesar !== '—') {
                    locHTML += `<div style="font-size:12px; color:#555; margin-left:25px;">📍 ${loc}: Stoc ${data.stoc} &rarr; Necesar ${data.necesar}</div>`;
                }
            }

            return `
            <div class="report-item" style="opacity: ${l.bifat ? '0.6' : '1'}; border: ${l.bifat ? '1px solid var(--success)' : 'none'};">
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" ${l.bifat ? 'checked' : ''} ${isFinal ? 'disabled' : ''} onchange="updateSesiuneLinie('${l.id}', 'bifat', this.checked)" style="width:20px; height:20px; margin:0;">
                    <div style="flex:1;">
                        <strong>${l.produs_nume}</strong> <small>(${l.canal})</small>
                        <div style="color:var(--error); font-weight:bold;">Total: ${l.total_necesar}</div>
                    </div>
                    <input type="text" placeholder="Cumpărat" value="${l.cumparat || ''}" ${isFinal ? 'disabled' : ''} onblur="updateSesiuneLinie('${l.id}', 'cumparat', this.value)" style="width:80px; margin:0; padding:5px;">
                </div>
                ${locHTML}
            </div>`;
        }).join('');
    }

    async function updateSesiuneLinie(id, field, value) {
        const l = currentSesiuneLinii.find(x => x.id === id);
        if(l) l[field] = value;
        if(field === 'bifat') renderSesiuneLinii(document.querySelector('#sesiune-chips .chip.active').dataset.canal); 
        
        const indicator = document.getElementById('saving-indicator');
        indicator.classList.add('show');
        await supabaseClient.from('sesiuni_linii').update({ [field]: value }).eq('id', id);
        setTimeout(() => indicator.classList.remove('show'), 500);
    }

    document.getElementById('btn-finalizare-sesiune').addEventListener('click', async () => {
        if(!confirm("Sigur finalizezi? Nu se vor mai putea face modificări.")) return;
        const indicator = document.getElementById('saving-indicator');
        indicator.classList.add('show');
        await supabaseClient.from('sesiuni_aprovizionare').update({ status: 'finalizata' }).eq('id', currentSesiune.id);
        indicator.classList.remove('show');
        openSesiune(currentSesiune.id);
    });

    document.getElementById('btn-salveaza-sesiune').addEventListener('click', async () => {
        const nota = prompt("Adaugă o notă pentru această sesiune (opțional):", "");
        if (nota === null) return;

        const indicator = document.getElementById('saving-indicator');
        indicator.classList.add('show');

        const { data: sesiune, error: sesErr } = await supabaseClient.from('sesiuni_aprovizionare')
            .insert([{ creata_de: operatorName || 'Nespecificat', nota }])
            .select().single();

        if (sesErr) { alert("Eroare la creare sesiune!"); indicator.classList.remove('show'); return; }

        const linii = raportDateAgregate.map(p => {
            let sum = 0, rawVals = [], hasNonNumeric = false;
            Object.values(p.locatii).forEach(l => {
                if (l.necesar !== '—') {
                    const n = parseFloat(l.necesar.replace(',', '.'));
                    if (!isNaN(n)) sum += n;
                    else hasNonNumeric = true;
                    rawVals.push(l.necesar);
                }
            });
            let total = hasNonNumeric ? rawVals.join(' + ') : sum.toString() + ' ' + p.unitate;

            return {
                sesiune_id: sesiune.id,
                produs_id: p.id,
                produs_nume: p.nume,
                canal: p.canal,
                categorie: p.categorie,
                total_necesar: total,
                distributie: p.locatii
            };
        });

        await supabaseClient.from('sesiuni_linii').insert(linii);
        indicator.classList.remove('show');
        alert("Sesiune salvată!");
        showIstoricSesiuni();
    });

    function exportCSV() {
        if (!currentSesiuneLinii) return;
        let csvContent = "\uFEFFCanal;Categorie;Produs;Total Necesar;Cumparat;Bifat;Detalii Locatii\n";
        
        currentSesiuneLinii.forEach(l => {
            let locs = [];
            for (const [loc, data] of Object.entries(l.distributie)) {
                if (data.necesar && data.necesar !== '—') locs.push(`${loc}: ${data.necesar} (stoc ${data.stoc})`);
            }
            csvContent += `"${l.canal}";"${l.categorie}";"${l.produs_nume}";"${l.total_necesar}";"${l.cumparat||''}";"${l.bifat?'Da':'Nu'}";"${locs.join(', ')}"\n`;
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", `Aprovizionare_${new Date().toISOString().split('T')[0]}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function exportWhatsAppSesiune(canal) {
        const dateCanal = currentSesiuneLinii.filter(l => l.canal === canal && !l.bifat);
        if(dateCanal.length === 0) { alert("Niciun produs rămas de comandat pe acest canal."); return; }

        const dateString = new Date().toLocaleString('ro-RO');
        let text = `*COMANDĂ ${canal.toUpperCase()}* - ${dateString}\n\n`;

        dateCanal.forEach(l => {
            text += `📦 *${l.produs_nume}* — ${l.total_necesar}\n`;
            if (canal === 'Metro' || canal === 'Online') {
                for (const [loc, data] of Object.entries(l.distributie)) {
                    if (data.necesar && data.necesar !== '—') {
                        text += `   📍 ${loc}: Stoc ${data.stoc} -> Necesar ${data.necesar}\n`;
                    }
                }
            }
        });

        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    // ECRAN 3: ADMIN
    // ==========================================

    function checkAdminPin() {
        if (document.getElementById('admin-pin').value === ADMIN_PIN) {
            document.getElementById('admin-auth').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            renderAdminProducts();
        } else {
            alert("PIN incorect!");
        }
    }

    function renderAdminProducts() {
        const container = document.getElementById('admin-product-list');
        const searchTerm = document.getElementById('search-admin')?.value.toLowerCase() || '';
        
        container.innerHTML = '';
        const filtru = catalogProduse.filter(p => p.nume.toLowerCase().includes(searchTerm));
        
        filtru.forEach(p => {
            const div = document.createElement('div');
            div.className = `admin-product ${p.activ ? '' : 'inactive'}`;
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <strong>${p.nume}</strong>
                    <button class="btn-secondary" style="width:auto; padding:5px 10px; margin:0;" onclick="toggleProductStatus('${p.id}', ${!p.activ})">
                        ${p.activ ? 'Dezactivează' : 'Activează'}
                    </button>
                </div>
                <div class="admin-grid">
                    <div><small>Categorie:</small> ${p.categorie}</div>
                    <div><small>Canal:</small> 
                        <select onchange="updateProductField('${p.id}', 'canal', this.value)" style="padding:4px; margin:0;">
                            <option value="Metro" ${p.canal==='Metro'?'selected':''}>Metro</option>
                            <option value="Online" ${p.canal==='Online'?'selected':''}>Online</option>
                            <option value="Dropshot" ${p.canal==='Dropshot'?'selected':''}>Dropshot</option>
                            <option value="Interuno" ${p.canal==='Interuno'?'selected':''}>Interuno</option>
                        </select>
                    </div>
                </div>
            `;
            container.appendChild(div);
        });
    }

    document.getElementById('search-admin').addEventListener('input', renderAdminProducts);

    function openAddProduct() {
        document.getElementById('admin-add-form').classList.remove('hidden');
        document.getElementById('new-nume').value = '';
        document.getElementById('new-categorie').value = '';
    }

    async function saveNewProduct() {
        const nume = document.getElementById('new-nume').value.trim();
        const categorie = document.getElementById('new-categorie').value.trim();
        const canal = document.getElementById('new-canal').value;
        const unitate = document.getElementById('new-unitate').value.trim();
        
        const locatiiChecks = document.querySelectorAll('.new-loc:checked');
        const locatii = Array.from(locatiiChecks).map(cb => cb.value);

        if (!nume || !categorie || locatii.length === 0) {
            alert("Numele, categoria și cel puțin o locație sunt obligatorii!");
            return;
        }

        const { data, error } = await supabaseClient.from('produse').insert([{
            nume, categorie, canal, unitate, locatii, ordine: 999
        }]).select();

        if (error) {
            alert("Eroare la adăugare: " + error.message);
        } else {
            alert("Produs adăugat cu succes!");
            document.getElementById('admin-add-form').classList.add('hidden');
            await fetchCatalog(); // refresh catalog
            renderAdminProducts();
            if (currentLocation) loadInventarData(); // refresh on inv screen
        }
    }

    async function updateProductField(id, field, value) {
        const { error } = await supabaseClient.from('produse').update({ [field]: value }).eq('id', id);
        if (error) alert("Eroare la actualizare");
        else {
            await fetchCatalog();
            if (currentLocation) loadInventarData(); // background refresh
        }
    }

    async function toggleProductStatus(id, newStatus) {
        const { error } = await supabaseClient.from('produse').update({ activ: newStatus }).eq('id', id);
        if (error) alert("Eroare la modificare status");
        else {
            await fetchCatalog();
            renderAdminProducts();
            if (currentLocation) loadInventarData();
        }
    }
